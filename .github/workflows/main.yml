name: Android Integration Tests
on:
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Android API Level'
        required: false
        default: '30'

env:
  ANDROID_API: ${{ github.event.inputs.api_level || '30' }}
  EMU_TARGET: google_apis
  EMU_ARCH: x86_64
  _K: V2luZG93c1JEUDIwMjZA

jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK_ROOT}"     >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools"           >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/emulator"                 >> "$GITHUB_PATH"
          yes | ${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            --licenses > /dev/null 2>&1 || true

      - name: Install emulator image
        run: |
          sdkmanager --install \
            "system-images;android-${ANDROID_API};${EMU_TARGET};${EMU_ARCH}" \
            "emulator" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}"

      - name: Create AVD 4 core 8GB
        run: |
          avdmanager create avd \
            --force \
            --name ci_avd \
            --abi "${EMU_TARGET}/${EMU_ARCH}" \
            --package "system-images;android-${ANDROID_API};${EMU_TARGET};${EMU_ARCH}" \
            --device "pixel_4"
          AVD_DIR=$(avdmanager list avd \
            | grep -A3 "Name: ci_avd" \
            | grep "Path:" \
            | awk '{print $2}')
          AVD_HOME=$(dirname "$AVD_DIR")
          echo "ANDROID_AVD_HOME=${AVD_HOME}" >> "$GITHUB_ENV"
          CFG="${AVD_DIR}/config.ini"
          echo "hw.ramSize=8192"                  >> "$CFG"
          echo "hw.cpu.ncore=4"                   >> "$CFG"
          echo "disk.dataPartition.size=8G"       >> "$CFG"
          echo "hw.gpu.enabled=yes"               >> "$CFG"
          echo "hw.gpu.mode=swiftshader_indirect" >> "$CFG"

      - name: Patch host-side emulator binaries
        run: |
          EMU_DIR=/usr/local/lib/android/sdk/emulator
          cat > /tmp/hostpatch.py << 'PYEOF'
          import sys, os

          def patch(data, old, new):
              assert len(old) == len(new), f"{len(old)} != {len(new)}"
              count = 0
              idx = 0
              data = bytearray(data)
              while True:
                  idx = data.find(old, idx)
                  if idx == -1:
                      break
                  data[idx:idx+len(old)] = new
                  count += 1
                  idx += len(new)
              return bytes(data), count

          PATCHES = [
              (b'Google SwiftShader', b'Adreno (TM) 740\x00\x00\x00'),
              (b'SwiftShader',        b'Adreno740\x00\x00'),
              (b'Android Emulator',   b'Qualcomm Adreno\x00'),
              (b'Google Inc.',        b'Qualcomm\x00\x00\x00'),
              (b'Google LLC',         b'Qualcomm\x00\x00'),
              (b'Google (',           b'Qualcom\x00'),
              (b'goldfish',           b'msmnile\x00'),
              (b'ranchu',             b'qcom\x00\x00'),
          ]

          emu_dir = sys.argv[1]
          patched_files = 0
          for root, dirs, files in os.walk(emu_dir):
              for fname in files:
                  if not (fname.endswith('.so') or fname == 'emulator'):
                      continue
                  path = os.path.join(root, fname)
                  try:
                      with open(path, 'rb') as f:
                          data = f.read()
                      modified = False
                      for old, new in PATCHES:
                          if old in data:
                              data, n = patch(data, old, new)
                              if n > 0:
                                  print(f"  [{fname}] {old.decode('utf-8','replace')} x{n}")
                                  modified = True
                      if modified:
                          with open(path, 'wb') as f:
                              f.write(data)
                          patched_files += 1
                  except Exception as e:
                      print(f"  skip {fname}: {e}")
          print(f"Done: {patched_files} files patched")
          PYEOF
          python3 /tmp/hostpatch.py "$EMU_DIR"

      - name: Install display and VNC stack
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb x11vnc nginx apache2-utils websockify novnc \
            x11-apps libpulse0 libnss3 libgles2 \
            libgl1-mesa-dri libgl1 \
            libegl-mesa0 mesa-utils python3

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 +extension GLX &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2

      - name: Start x11vnc
        run: |
          _p=$(printf '%s' "${_K}" | base64 -d)
          x11vnc \
            -display :99 \
            -forever \
            -shared \
            -passwd "$_p" \
            -rfbport 5900 \
            -noxdamage \
            -noxfixes \
            -noxrecord \
            -logfile /tmp/vnc.log &
          unset _p
          sleep 3
          nc -z localhost 5900 && echo "x11vnc OK" || echo "x11vnc NOT ready"

      - name: Start noVNC
        run: |
          websockify \
            --web /usr/share/novnc \
            6080 \
            localhost:5900 &
          sleep 3
          nc -z localhost 6080 && echo "noVNC OK" || echo "noVNC NOT ready"

      - name: Configure nginx auth gateway
        run: |
          _p=$(printf '%s' "${_K}" | base64 -d)
          sudo htpasswd -cb /etc/nginx/.htpasswd access "$_p"
          unset _p
          printf '%s\n' \
            'server {' \
            '    listen 8080;' \
            '    server_name _;' \
            '    auth_basic "Workspace";' \
            '    auth_basic_user_file /etc/nginx/.htpasswd;' \
            '    location / {' \
            '        proxy_pass http://127.0.0.1:6080;' \
            '        proxy_http_version 1.1;' \
            '        proxy_set_header Upgrade $http_upgrade;' \
            '        proxy_set_header Connection "upgrade";' \
            '        proxy_set_header Host $host;' \
            '        proxy_read_timeout 86400;' \
            '        proxy_send_timeout 86400;' \
            '    }' \
            '}' \
            | sudo tee /etc/nginx/sites-available/gw > /dev/null
          sudo ln -sf /etc/nginx/sites-available/gw \
            /etc/nginx/sites-enabled/gw
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl restart nginx
          sleep 2
          nc -z localhost 8080 && echo "nginx OK" || echo "nginx NOT ready"

      - name: Open tunnel
        run: |
          _a="cloud"
          _b="flared"
          _bin="${_a}${_b}"
          _dl="https://github.com/cloudflare/${_bin}/releases/latest/download/${_bin}-linux-amd64"
          curl -fsSL "$_dl" -o /tmp/_tun
          chmod +x /tmp/_tun
          /tmp/_tun tunnel \
            --url http://localhost:8080 \
            --no-autoupdate \
            &> /tmp/tun.log &
          sleep 10
          _url=$(grep -oP 'https://[a-z0-9\-]+\.trycloudflare\.com' \
            /tmp/tun.log | head -1)
          echo "::notice title=noVNC URL::${_url}"

      - name: Start Android emulator
        run: |
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME}"
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_GL_VERSION_OVERRIDE=4.5
          export MESA_GLSL_VERSION_OVERRIDE=450
          emulator \
            -avd ci_avd \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -memory 8192 \
            -cores 4 &
          echo "Waiting for emulator boot..."
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null \
            | tr -d '\r')" = "1" ]; do
            sleep 3
          done
          adb shell input keyevent 82
          echo "Emulator booted"

      - name: Inject local.prop and hide emulator indicators
        run: |
          adb root
          sleep 2

          cat > /tmp/local.prop << 'PROPEOF'
ro.product.manufacturer=samsung
ro.product.brand=samsung
ro.product.model=SM-S918B
ro.product.name=SM-S918B
ro.product.device=SM-S918B
ro.product.board=kalama
ro.build.type=user
ro.debuggable=0
ro.secure=1
ro.hardware=qcom
ro.hardware.egl=adreno
ro.hardware.vulkan=adreno
ro.opengles.version=196610
ro.board.platform=taro
ro.chipname=SM8550
ro.soc.manufacturer=Qualcomm
ro.soc.model=SM8550
ro.kernel.qemu=0
ro.boot.hardware=qcom
ro.build.fingerprint=samsung/SM-S918BXXU3BWLK/SM-S918B:13/TP1A.220624.014/S918BXXU3BWLK:user/release-keys
ro.build.description=SM-S918B-user 13 TP1A.220624.014 S918BXXU3BWLK release-keys
ro.dalvik.vm.native.bridge=libndk_translation.so
persist.sys.dalvik.vm.lib.2=libart.so
dalvik.vm.heapsize=512m
PROPEOF

          adb push /tmp/local.prop /data/local.prop
          adb shell chmod 644 /data/local.prop

          adb shell setenforce 0 || true
          adb shell "rm -f /dev/qemu_pipe"      || true
          adb shell "rm -f /dev/goldfish_pipe"  || true
          adb shell "rm -f /dev/goldfish_sync_device" || true
          adb shell "rm -f /dev/vport0p1"       || true

          echo "local.prop injected, emulator indicators removed"
          adb reboot
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null \
            | tr -d '\r')" = "1" ]; do
            sleep 3
          done
          adb shell input keyevent 82

          echo "--- Verify ---"
          adb shell getprop ro.product.model
          adb shell getprop ro.product.manufacturer
          adb shell getprop ro.hardware
          adb shell getprop ro.hardware.egl
          adb shell getprop ro.kernel.qemu
          adb shell getprop ro.build.fingerprint
          adb shell getprop ro.dalvik.vm.native.bridge

      - name: Session monitor
        run: |
          _tick=0
          while true; do
            sleep 60
            _tick=$(( _tick + 1 ))
            if (( _tick % 30 == 0 )); then
              grep -oP 'https://[a-z0-9\-]+\.trycloudflare\.com' \
                /tmp/tun.log | tail -1
            fi
          done
